<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TPC-H engine corpus</title>
<style>
  :root { --fg:#1a1a1a; --dim:#666; --line:#ddd; --bg:#fff; --accent:#0b5; }
  @media (prefers-color-scheme: dark) {
    :root { --fg:#e6e6e6; --dim:#999; --line:#333; --bg:#141414; --accent:#3d9; }
  }
  * { box-sizing: border-box; }
  body { font: 14px/1.5 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
         color: var(--fg); background: var(--bg); margin: 0; padding: 1.5rem;
         max-width: 1600px; }
  h1 { font-size: 1.1rem; font-weight: 600; margin: 0 0 .25rem; }
  #status { color: var(--dim); margin-bottom: 1rem; }
  #status.err { color: #c33; }
  .row { display: flex; gap: .5rem; flex-wrap: wrap; margin-bottom: .75rem;
         align-items: center; }
  .label { color: var(--dim); font-size: 12px; margin-right: .25rem; }
  button { font: inherit; padding: .35rem .7rem; cursor: pointer;
           background: var(--bg); color: var(--fg);
           border: 1px solid var(--line); border-radius: 3px; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .4; cursor: default; }
  button.on { border-color: var(--accent); color: var(--accent); font-weight: 600; }
  .tabs { border-bottom: 1px solid var(--line); padding-bottom: .75rem;
          margin-bottom: .75rem; }
  .tabs button { padding: .4rem 1.1rem; }
  textarea { width: 100%; font: inherit; padding: .6rem;
             background: var(--bg); color: var(--fg);
             border: 1px solid var(--line); border-radius: 3px; resize: vertical; }
  #sql { min-height: 9rem; }
  #spec { min-height: 15rem; }
  #meta { color: var(--dim); margin: .75rem 0; }
  .scroll { overflow: auto; max-height: 65vh; border: 1px solid var(--line);
            border-radius: 3px; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { padding: .3rem .6rem; text-align: left; white-space: nowrap;
           border-bottom: 1px solid var(--line); }
  th { position: sticky; top: 0; background: var(--bg); font-weight: 600;
       cursor: pointer; user-select: none; }
  th:hover { color: var(--accent); }
  td.num { text-align: left; font-variant-numeric: tabular-nums; }
  tbody tr:hover { background: color-mix(in srgb, var(--fg) 6%, transparent); }
  .panes { display: grid; grid-template-columns: 400px 1fr; gap: 1rem; }
  @media (max-width: 950px) { .panes { grid-template-columns: 1fr; } }
  #chart { border: 1px solid var(--line); border-radius: 3px; padding: .75rem;
           overflow: auto; min-height: 22rem; }
  .hide { display: none; }
  #specerr { color: #c33; font-size: 12px; min-height: 1.2em; }
</style>
</head>
<body>

<h1>TPC-H engine selection corpus</h1>
<div id="status">loading database&hellip;</div>

<div class="row tabs">
  <button id="tabTable" class="on">Table</button>
  <button id="tabChart">Chart</button>
</div>

<div class="row"><span class="label" id="viewLabel">views</span><span id="views"></span></div>

<textarea id="sql" spellcheck="false"></textarea>
<div class="row" style="margin-top:.5rem">
  <button id="run" disabled>Run  (Ctrl/Cmd+Enter)</button>
  <button id="csv" disabled>CSV</button>
  <button id="svg" disabled class="hide">SVG</button>
  <button id="link" disabled>Copy link</button>
  <span id="meta"></span>
</div>

<div id="paneTable"><div class="scroll">
  <table><thead id="head"></thead><tbody id="body"></tbody></table>
</div></div>

<div id="paneChart" class="hide panes">
  <div>
    <div class="label">Vega-Lite spec &mdash; query result injected as <code>values</code></div>
    <textarea id="spec" spellcheck="false"></textarea>
    <div id="specerr"></div>
  </div>
  <div id="chart"></div>
</div>

<script src="sql-wasm.js"></script>
<script src="vega.min.js"></script>
<script src="vega-lite.min.js"></script>
<script src="vega-embed.min.js"></script>
<script>
// The published copy is named differently depending on how it is produced.
// Override with #db=name in the URL.
const DB_CANDIDATES = ["corpus.sqlite", "corpus.db", "publish.sqlite"];

const TABLE_VIEWS = {
 "all runs": "SELECT * FROM v_runs\nORDER BY node, config_name, sf_label, query, threads, engine",
 "h vs v": "-- z is the effect size in units of each cell's own noise.\n-- |z| < 2 means the difference is not resolvable at this precision.\nSELECT node, config_name, sf_label, query, threads,\n       ROUND(h_median_ns/1e6, 3) AS h_ms,\n       ROUND(v_median_ns/1e6, 3) AS v_ms,\n       ROUND(h_over_v, 3)  AS h_over_v,\n       ROUND(rel_diff, 4)  AS rel_diff,\n       ROUND(pooled_cv, 4) AS pooled_cv,\n       ROUND(z, 2)         AS z,\n       winner\nFROM engine_pair\nORDER BY node, query, scale_factor, threads",
 "engine duel (incl. b)": "-- All unordered engine pairs, including 'b' (q6 branching), which\n-- engine_pair cannot see. 'winner' names an engine code.\nSELECT node, cpu_vendor, config_name, pair, query, sf_label, threads,\n       ROUND(a_median_ns/1e6, 3) AS a_ms,\n       ROUND(b_median_ns/1e6, 3) AS b_ms,\n       ROUND(a_over_b, 3) AS a_over_b,\n       ROUND(z, 2) AS z, winner\nFROM engine_duel\nORDER BY node, query, pair, threads",
 "win rate / build": "-- Grouped by (binary, machine) since 0019: pooling an ARM result with a\n-- Xeon one was the bug that view fixed.\nSELECT * FROM v_win_rate_by_build ORDER BY node, config_name",
 "win rate / query": "SELECT * FROM v_win_rate_by_build_query\nORDER BY node, config_name, q_number",
 "win rate long": "-- One row per (build, machine, query, engine). Ties appear on BOTH engine\n-- rows, so wins+ties will not sum to cells across the pair -- a tie belongs\n-- to the cell, not to either engine.\nSELECT * FROM v_win_rate_long ORDER BY node, config_name, q_number, engine",
 "duel win rate": "SELECT * FROM v_duel_win_rate ORDER BY node, pair, query",
 "balanced panel": "-- Only cells every build has, computed WITHIN a machine. If cells_used\n-- collapses against cells_total, the panel is too thin to conclude anything\n-- -- which is itself the finding.\nSELECT * FROM v_win_rate_balanced ORDER BY node, config_name",
 "imbalance": "-- Read BEFORE comparing builds. A build missing a scale factor is not\n-- comparable to one that has it; the crossover moves with data size.\nSELECT * FROM v_build_balance ORDER BY node, config_name, scale_factor",
 "crossover by sf": "-- The shape the model has to predict, seen directly.\nSELECT * FROM v_win_rate_by_sf\nORDER BY node, config_name, scale_factor, query, threads",
 "coverage": "SELECT m.stable_key AS node, bs.config_name, d.sf_label,\n       COUNT(DISTINCT t.query_id) AS queries,\n       COUNT(DISTINCT t.threads)  AS thread_counts,\n       COUNT(DISTINCT r.engine_id) AS engines,\n       COUNT(*) AS runs,\n       MAX(ib.ingested_at) AS last_ingest\nFROM run r\nJOIN task t              ON t.task_id = r.task_id\nJOIN dataset d           ON d.dataset_id = t.dataset_id\nJOIN ingest_batch ib     ON ib.batch_id = r.batch_id\nJOIN build_event be      ON be.build_event_id = r.build_event_id\nJOIN build_spec bs       ON bs.spec_id = be.spec_id\nJOIN machine_snapshot ms ON ms.snapshot_id = r.snapshot_id\nJOIN machine m           ON m.machine_id = ms.machine_id\nGROUP BY m.machine_id, bs.config_name, d.dataset_id\nORDER BY node, config_name, d.scale_factor",
 "orphan cells": "-- Cells measured for fewer than two engines: worth nothing for comparison.\n-- Expect rows mid-campaign; only meaningful once a batch finishes.\nSELECT m.stable_key AS node, bs.config_name, d.sf_label, q.label AS query,\n       t.threads, GROUP_CONCAT(e.code) AS engines_present, COUNT(*) AS n\nFROM run r\nJOIN task t              ON t.task_id = r.task_id\nJOIN query q             ON q.query_id = t.query_id\nJOIN dataset d           ON d.dataset_id = t.dataset_id\nJOIN engine e            ON e.engine_id = r.engine_id\nJOIN build_event be      ON be.build_event_id = r.build_event_id\nJOIN build_spec bs       ON bs.spec_id = be.spec_id\nJOIN machine_snapshot ms ON ms.snapshot_id = r.snapshot_id\nJOIN machine m           ON m.machine_id = ms.machine_id\nWHERE r.quality = 'clean'\nGROUP BY r.task_id, r.build_event_id, r.snapshot_id, r.trial\nHAVING COUNT(DISTINCT r.engine_id) < 2",
 "noisy": "-- This sets your tie threshold. If typical cv is 0.005 the |z|<2 band is\n-- about 1%; at 0.03 it is 6%. It differs by machine.\nSELECT node, config_name, sf_label, query, engine, threads, cv, median_ms\nFROM v_runs\nWHERE cv IS NOT NULL AND quality = 'clean' AND cv > 0.02\nORDER BY cv DESC LIMIT 200",
 "counters": "-- Raw counters, one row per run. Within a single vendor only: ARM's nearest\n-- LLC-miss event does not count what Intel's counts. Use the\n-- 'counters cross-vendor' view when spanning burrata and an x86 node.\nSELECT * FROM v_run_counters_wide\nORDER BY config_name, sf_label, query, threads",
 "counters cross-vendor": "-- Only counters that mean the same thing on ARM and x86.\nSELECT r.node, r.config_name, r.sf_label, r.query, r.engine, r.threads,\n       r.median_ms,\n       MAX(CASE WHEN c.event='cycles'       THEN c.value END) AS cycles,\n       MAX(CASE WHEN c.event='instructions' THEN c.value END) AS instructions,\n       MAX(CASE WHEN c.event='task_clock'   THEN c.value END) AS task_clock,\n       ROUND(MAX(CASE WHEN c.event='instructions' THEN c.value END) /\n             NULLIF(MAX(CASE WHEN c.event='cycles' THEN c.value END),0), 3) AS ipc\nFROM v_runs r\nJOIN v_counters_comparable c ON c.run_id = r.run_id\nGROUP BY r.run_id\nORDER BY r.node, r.query, r.threads",
 "machines": "SELECT m.stable_key AS node, m.partition, ms.snapshot_id,\n       ms.cpu_vendor, ms.cpu_model, ms.cores_physical, ms.threads_logical,\n       ms.numa_nodes, ms.l3_bytes, ms.kernel_version, ms.observed_from\nFROM machine_snapshot ms\nJOIN machine m ON m.machine_id = ms.machine_id\nORDER BY node, ms.observed_from DESC",
 "builds": "SELECT be.build_event_id, bs.config_name,\n       substr(hex(bs.repo_sha),1,8) AS head, bs.repo_dirty, bs.cmake_defs,\n       substr(hex(b.content_sha256),1,12) AS binary_sha, be.built_at\nFROM build_event be\nJOIN build_spec bs ON bs.spec_id = be.spec_id\nJOIN binary b      ON b.binary_id = be.binary_id\nORDER BY be.built_at DESC",
 "headers": "-- Counter columns each header layout supplies. burrata's PMU exposes fewer\n-- events, so its .out is narrower than v4's.\nSELECT * FROM v_header_expectations ORDER BY header_version",
 "reproducibility": "-- Same recipe, same commit, different bits: cross-build deltas may be\n-- codegen luck rather than signal.\nSELECT * FROM spec_reproducibility",
 "schema": "SELECT type, name, sql FROM sqlite_master\nWHERE name NOT LIKE 'sqlite_%' ORDER BY type, name"
};

const CHART_VIEWS = {
 "1. bars: sf1, 1 thread": {
  "sql": "-- ==========================================================================\n-- CONTROLLING WHICH BUILD IS PLOTTED\n--\n-- By default this includes EVERY build_event. If you have more than one\n-- config (default_huge, shard_nohuge, ...) each query/engine/machine will\n-- appear once per build and the bars will be averaged together, which is\n-- almost never what you want.\n--\n-- Pick one:\n--   a) one named config  -> uncomment the config_name line\n--   b) one exact build   -> uncomment the build_event_id line, get ids from\n--                           the 'builds' table view or: vocab builds\n--   c) latest build only -> uncomment the sub-select line\n--   d) keep them all and compare -> leave commented, and change the chart's\n--      \"column\" encoding from node to config_name (or add a row facet)\n-- ==========================================================================\nSELECT m.stable_key           AS node,\n       q.label                AS query,\n       q.q_number,\n       e.code                 AS engine,\n       bs.config_name,\n       ROUND(AVG(r.median_ns) / 1e6, 3) AS median_ms\nFROM run r\nJOIN task t              ON t.task_id = r.task_id\nJOIN query q             ON q.query_id = t.query_id\nJOIN dataset d           ON d.dataset_id = t.dataset_id\nJOIN engine e            ON e.engine_id = r.engine_id\nJOIN build_event be      ON be.build_event_id = r.build_event_id\nJOIN build_spec bs       ON bs.spec_id = be.spec_id\nJOIN machine_snapshot ms ON ms.snapshot_id = r.snapshot_id\nJOIN machine m           ON m.machine_id = ms.machine_id\nWHERE r.quality = 'clean'\n  AND d.sf_label = 'sf1'\n  AND t.threads  = 1\n  -- AND bs.config_name = 'default_huge'\n  -- AND be.build_event_id = 1\n  -- AND be.build_event_id = (SELECT MAX(build_event_id) FROM build_event)\nGROUP BY m.machine_id, q.query_id, e.engine_id\nORDER BY m.stable_key, q.q_number, e.code",
  "spec": "{\n  \"$schema\": \"https://vega.github.io/schema/vega-lite/v5.json\",\n  \"data\": {\n    \"name\": \"table\"\n  },\n  \"width\": 300,\n  \"height\": 300,\n  \"mark\": {\n    \"type\": \"bar\"\n  },\n  \"encoding\": {\n    \"x\": {\n      \"field\": \"query\",\n      \"type\": \"nominal\",\n      \"title\": null,\n      \"sort\": {\n        \"field\": \"q_number\"\n      }\n    },\n    \"y\": {\n      \"field\": \"median_ms\",\n      \"type\": \"quantitative\",\n      \"title\": \"median ms\"\n    },\n    \"xOffset\": {\n      \"field\": \"engine\",\n      \"type\": \"nominal\"\n    },\n    \"color\": {\n      \"field\": \"engine\",\n      \"type\": \"nominal\"\n    },\n    \"column\": {\n      \"field\": \"node\",\n      \"type\": \"nominal\",\n      \"title\": null\n    },\n    \"tooltip\": [\n      {\n        \"field\": \"node\"\n      },\n      {\n        \"field\": \"query\"\n      },\n      {\n        \"field\": \"engine\"\n      },\n      {\n        \"field\": \"config_name\"\n      },\n      {\n        \"field\": \"median_ms\"\n      }\n    ]\n  },\n  \"config\": {\n    \"background\": null,\n    \"font\": \"ui-monospace, Menlo, Consolas, monospace\",\n    \"axis\": {\n      \"labelFontSize\": 11,\n      \"titleFontSize\": 12,\n      \"grid\": true,\n      \"gridColor\": \"#8884\",\n      \"domainColor\": \"#8886\",\n      \"tickColor\": \"#8886\"\n    },\n    \"legend\": {\n      \"labelFontSize\": 11,\n      \"titleFontSize\": 12\n    },\n    \"view\": {\n      \"stroke\": \"transparent\"\n    },\n    \"range\": {\n      \"category\": [\n        \"#0b5\",\n        \"#c50\",\n        \"#06c\",\n        \"#a2b\",\n        \"#888\",\n        \"#c33\"\n      ]\n    }\n  }\n}"
 },
 "2. bars: best time in corpus": {
  "sql": "-- Best (minimum) observed time for each engine x query x machine.\n--\n-- NOTE ON SCOPE: as written this minimises across EVERYTHING else -- every\n-- scale factor, thread count, build and trial in the corpus. Since sf1 is\n-- always faster than sf100, the winner is effectively \"sf1 at its best thread\n-- count\", which may not be the comparison you want.\n--\n-- To hold the data size fixed and take the best thread count (usually the\n-- intended reading), uncomment the sf_label line.\n-- To restrict to one build, uncomment the config_name line.\nSELECT m.stable_key AS node,\n       q.label      AS query,\n       q.q_number,\n       e.code       AS engine,\n       ROUND(MIN(r.min_ns) / 1e6, 3) AS best_ms,\n       COUNT(*)                      AS runs_considered,\n       MIN(t.threads)                AS threads_at_min\nFROM run r\nJOIN task t              ON t.task_id = r.task_id\nJOIN query q             ON q.query_id = t.query_id\nJOIN dataset d           ON d.dataset_id = t.dataset_id\nJOIN engine e            ON e.engine_id = r.engine_id\nJOIN build_event be      ON be.build_event_id = r.build_event_id\nJOIN build_spec bs       ON bs.spec_id = be.spec_id\nJOIN machine_snapshot ms ON ms.snapshot_id = r.snapshot_id\nJOIN machine m           ON m.machine_id = ms.machine_id\nWHERE r.quality = 'clean'\n  AND r.min_ns IS NOT NULL\n  -- AND d.sf_label = 'sf1'\n  -- AND bs.config_name = 'default_huge'\nGROUP BY m.machine_id, q.query_id, e.engine_id\nORDER BY m.stable_key, q.q_number, e.code",
  "spec": "{\n  \"$schema\": \"https://vega.github.io/schema/vega-lite/v5.json\",\n  \"data\": {\n    \"name\": \"table\"\n  },\n  \"width\": 300,\n  \"height\": 300,\n  \"mark\": {\n    \"type\": \"bar\"\n  },\n  \"encoding\": {\n    \"x\": {\n      \"field\": \"query\",\n      \"type\": \"nominal\",\n      \"title\": null,\n      \"sort\": {\n        \"field\": \"q_number\"\n      }\n    },\n    \"y\": {\n      \"field\": \"best_ms\",\n      \"type\": \"quantitative\",\n      \"title\": \"best ms (min over corpus)\"\n    },\n    \"xOffset\": {\n      \"field\": \"engine\",\n      \"type\": \"nominal\"\n    },\n    \"color\": {\n      \"field\": \"engine\",\n      \"type\": \"nominal\"\n    },\n    \"column\": {\n      \"field\": \"node\",\n      \"type\": \"nominal\",\n      \"title\": null\n    },\n    \"tooltip\": [\n      {\n        \"field\": \"node\"\n      },\n      {\n        \"field\": \"query\"\n      },\n      {\n        \"field\": \"engine\"\n      },\n      {\n        \"field\": \"best_ms\"\n      },\n      {\n        \"field\": \"threads_at_min\"\n      },\n      {\n        \"field\": \"runs_considered\"\n      }\n    ]\n  },\n  \"config\": {\n    \"background\": null,\n    \"font\": \"ui-monospace, Menlo, Consolas, monospace\",\n    \"axis\": {\n      \"labelFontSize\": 11,\n      \"titleFontSize\": 12,\n      \"grid\": true,\n      \"gridColor\": \"#8884\",\n      \"domainColor\": \"#8886\",\n      \"tickColor\": \"#8886\"\n    },\n    \"legend\": {\n      \"labelFontSize\": 11,\n      \"titleFontSize\": 12\n    },\n    \"view\": {\n      \"stroke\": \"transparent\"\n    },\n    \"range\": {\n      \"category\": [\n        \"#0b5\",\n        \"#c50\",\n        \"#06c\",\n        \"#a2b\",\n        \"#888\",\n        \"#c33\"\n      ]\n    }\n  }\n}"
 },
 "3. thread sweep by query": {
  "sql": "-- Runtime against thread count. One subplot per query, one colour per\n-- engine. All measured thread counts, not just powers of two.\n--\n-- Fix the data size and the build unless you want them overlaid:\n--   AND d.sf_label = 'sf10'\n--   AND bs.config_name = 'default_huge'\nSELECT m.stable_key AS node,\n       q.label      AS query,\n       q.q_number,\n       e.code       AS engine,\n       bs.config_name,\n       d.sf_label,\n       t.threads,\n       ROUND(AVG(r.median_ns) / 1e6, 3) AS median_ms\nFROM run r\nJOIN task t              ON t.task_id = r.task_id\nJOIN query q             ON q.query_id = t.query_id\nJOIN dataset d           ON d.dataset_id = t.dataset_id\nJOIN engine e            ON e.engine_id = r.engine_id\nJOIN build_event be      ON be.build_event_id = r.build_event_id\nJOIN build_spec bs       ON bs.spec_id = be.spec_id\nJOIN machine_snapshot ms ON ms.snapshot_id = r.snapshot_id\nJOIN machine m           ON m.machine_id = ms.machine_id\nWHERE r.quality = 'clean'\n  -- AND d.sf_label = 'sf10'\n  -- AND bs.config_name = 'default_huge'\nGROUP BY m.machine_id, q.query_id, e.engine_id, t.threads\nORDER BY q.q_number, t.threads",
  "spec": "{\n  \"$schema\": \"https://vega.github.io/schema/vega-lite/v5.json\",\n  \"data\": {\n    \"name\": \"table\"\n  },\n  \"facet\": {\n    \"field\": \"query\",\n    \"type\": \"nominal\",\n    \"columns\": 3,\n    \"sort\": {\n      \"field\": \"q_number\"\n    },\n    \"title\": null\n  },\n  \"spec\": {\n    \"width\": 210,\n    \"height\": 180,\n    \"mark\": {\n      \"type\": \"line\",\n      \"point\": true\n    },\n    \"encoding\": {\n      \"x\": {\n        \"field\": \"threads\",\n        \"type\": \"quantitative\",\n        \"scale\": {\n          \"type\": \"log\",\n          \"base\": 2\n        },\n        \"title\": \"threads\"\n      },\n      \"y\": {\n        \"field\": \"median_ms\",\n        \"type\": \"quantitative\",\n        \"title\": \"median ms\"\n      },\n      \"color\": {\n        \"field\": \"engine\",\n        \"type\": \"nominal\"\n      },\n      \"strokeDash\": {\n        \"field\": \"node\",\n        \"type\": \"nominal\",\n        \"title\": \"node\"\n      },\n      \"tooltip\": [\n        {\n          \"field\": \"node\"\n        },\n        {\n          \"field\": \"query\"\n        },\n        {\n          \"field\": \"engine\"\n        },\n        {\n          \"field\": \"threads\"\n        },\n        {\n          \"field\": \"median_ms\"\n        }\n      ]\n    }\n  },\n  \"config\": {\n    \"background\": null,\n    \"font\": \"ui-monospace, Menlo, Consolas, monospace\",\n    \"axis\": {\n      \"labelFontSize\": 11,\n      \"titleFontSize\": 12,\n      \"grid\": true,\n      \"gridColor\": \"#8884\",\n      \"domainColor\": \"#8886\",\n      \"tickColor\": \"#8886\"\n    },\n    \"legend\": {\n      \"labelFontSize\": 11,\n      \"titleFontSize\": 12\n    },\n    \"view\": {\n      \"stroke\": \"transparent\"\n    },\n    \"range\": {\n      \"category\": [\n        \"#0b5\",\n        \"#c50\",\n        \"#06c\",\n        \"#a2b\",\n        \"#888\",\n        \"#c33\"\n      ]\n    }\n  }\n}"
 },
 "4. scaling curves (2^k only)": {
  "sql": "-- Log-log scaling. A straight line of slope -1 is perfect scaling;\n-- flattening is where adding threads stops paying.\n--\n-- Restricted to power-of-two thread counts via (threads & (threads-1)) = 0,\n-- which is true only when exactly one bit is set. Drop that line to include\n-- every measured thread count.\nSELECT m.stable_key AS node,\n       q.label      AS query,\n       q.q_number,\n       e.code       AS engine,\n       bs.config_name,\n       d.sf_label,\n       t.threads,\n       ROUND(AVG(r.median_ns) / 1e6, 3) AS median_ms\nFROM run r\nJOIN task t              ON t.task_id = r.task_id\nJOIN query q             ON q.query_id = t.query_id\nJOIN dataset d           ON d.dataset_id = t.dataset_id\nJOIN engine e            ON e.engine_id = r.engine_id\nJOIN build_event be      ON be.build_event_id = r.build_event_id\nJOIN build_spec bs       ON bs.spec_id = be.spec_id\nJOIN machine_snapshot ms ON ms.snapshot_id = r.snapshot_id\nJOIN machine m           ON m.machine_id = ms.machine_id\nWHERE r.quality = 'clean'\n  AND (t.threads & (t.threads - 1)) = 0     -- powers of two only\n  -- AND bs.config_name = 'default_huge'\nGROUP BY m.machine_id, q.query_id, e.engine_id, d.dataset_id, t.threads\nORDER BY m.stable_key, q.q_number, t.threads",
  "spec": "{\n  \"$schema\": \"https://vega.github.io/schema/vega-lite/v5.json\",\n  \"data\": {\n    \"name\": \"table\"\n  },\n  \"facet\": {\n    \"row\": {\n      \"field\": \"node\",\n      \"type\": \"nominal\",\n      \"title\": null\n    },\n    \"column\": {\n      \"field\": \"query\",\n      \"type\": \"nominal\",\n      \"title\": null,\n      \"sort\": {\n        \"field\": \"q_number\"\n      }\n    }\n  },\n  \"spec\": {\n    \"width\": 190,\n    \"height\": 165,\n    \"mark\": {\n      \"type\": \"line\",\n      \"point\": true\n    },\n    \"encoding\": {\n      \"x\": {\n        \"field\": \"threads\",\n        \"type\": \"quantitative\",\n        \"scale\": {\n          \"type\": \"log\",\n          \"base\": 2\n        },\n        \"title\": \"threads\"\n      },\n      \"y\": {\n        \"field\": \"median_ms\",\n        \"type\": \"quantitative\",\n        \"scale\": {\n          \"type\": \"log\"\n        },\n        \"title\": \"median ms\"\n      },\n      \"color\": {\n        \"field\": \"engine\",\n        \"type\": \"nominal\"\n      },\n      \"strokeDash\": {\n        \"field\": \"sf_label\",\n        \"type\": \"nominal\",\n        \"title\": \"scale\"\n      },\n      \"tooltip\": [\n        {\n          \"field\": \"node\"\n        },\n        {\n          \"field\": \"query\"\n        },\n        {\n          \"field\": \"engine\"\n        },\n        {\n          \"field\": \"sf_label\"\n        },\n        {\n          \"field\": \"threads\"\n        },\n        {\n          \"field\": \"median_ms\"\n        }\n      ]\n    }\n  },\n  \"config\": {\n    \"background\": null,\n    \"font\": \"ui-monospace, Menlo, Consolas, monospace\",\n    \"axis\": {\n      \"labelFontSize\": 11,\n      \"titleFontSize\": 12,\n      \"grid\": true,\n      \"gridColor\": \"#8884\",\n      \"domainColor\": \"#8886\",\n      \"tickColor\": \"#8886\"\n    },\n    \"legend\": {\n      \"labelFontSize\": 11,\n      \"titleFontSize\": 12\n    },\n    \"view\": {\n      \"stroke\": \"transparent\"\n    },\n    \"range\": {\n      \"category\": [\n        \"#0b5\",\n        \"#c50\",\n        \"#06c\",\n        \"#a2b\",\n        \"#888\",\n        \"#c33\"\n      ]\n    }\n  }\n}"
 }
};

const $ = id => document.getElementById(id);
const status = $("status"), meta = $("meta"), specerr = $("specerr");
let db = null, cols = [], rows = [], sortCol = null, sortDir = 1, tab = "table";

function readHash() {
  const out = {};
  for (const part of location.hash.replace(/^#/, "").split("&")) {
    const i = part.indexOf("=");
    if (i < 0) continue;
    try { out[part.slice(0, i)] = decodeURIComponent(part.slice(i + 1)); } catch {}
  }
  return out;
}
const h0 = readHash();

function shareURL() {
  let u = location.origin + location.pathname
        + "#t=" + tab + "&q=" + encodeURIComponent($("sql").value);
  if (tab === "chart") u += "&v=" + encodeURIComponent($("spec").value);
  return u;
}
function syncHash() { history.replaceState(null, "", shareURL().replace(/^[^#]*/, "")); }

// The two tabs carry independent view sets: table views are SQL only, chart
// views pair SQL with a spec. Switching rebuilds the button row.
function buildViewButtons() {
  const host = $("views");
  host.innerHTML = "";
  const set = tab === "chart" ? CHART_VIEWS : TABLE_VIEWS;
  $("viewLabel").textContent = tab === "chart" ? "chart views" : "table views";
  for (const name of Object.keys(set)) {
    const b = document.createElement("button");
    b.textContent = name;
    b.onclick = () => {
      if (tab === "chart") {
        $("sql").value = set[name].sql;
        $("spec").value = set[name].spec;
      } else {
        $("sql").value = set[name];
      }
      run();
    };
    host.appendChild(b);
  }
}

function setTab(t, keepSql) {
  tab = t;
  $("tabTable").classList.toggle("on", t === "table");
  $("tabChart").classList.toggle("on", t === "chart");
  $("paneTable").classList.toggle("hide", t !== "table");
  $("paneChart").classList.toggle("hide", t !== "chart");
  $("svg").classList.toggle("hide", t !== "chart");
  buildViewButtons();
  if (!keepSql) {
    // Load that tab's first view, so switching always lands on something real.
    const set = t === "chart" ? CHART_VIEWS : TABLE_VIEWS;
    const first = Object.keys(set)[0];
    $("sql").value = t === "chart" ? set[first].sql : set[first];
    if (t === "chart") $("spec").value = set[first].spec;
    if (db) run();
  } else if (t === "chart") { draw(); }
  syncHash();
}
$("tabTable").onclick = () => setTab("table");
$("tabChart").onclick = () => setTab("chart");

// Initial state: hash wins, else the first view of the chosen tab.
tab = h0.t === "chart" ? "chart" : "table";
buildViewButtons();
{
  const set = tab === "chart" ? CHART_VIEWS : TABLE_VIEWS;
  const first = Object.keys(set)[0];
  $("sql").value  = h0.q || (tab === "chart" ? set[first].sql : set[first]);
  $("spec").value = h0.v || CHART_VIEWS[Object.keys(CHART_VIEWS)[0]].spec;
}

function fail(msg) { status.textContent = msg; status.className = "err"; }

(async () => {
  try {
    const SQL = await initSqlJs({ locateFile: f => f });
    const names = h0.db ? [h0.db, ...DB_CANDIDATES] : DB_CANDIDATES;
    let res = null; const tried = [];
    for (const n of names) {
      const r = await fetch(n, { cache: "no-cache" });
      if (r.ok) { res = r; break; }
      tried.push(`${n} (${r.status})`);
    }
    if (!res) throw new Error("no database found: tried " + tried.join(", "));
    const buf = await res.arrayBuffer();
    db = new SQL.Database(new Uint8Array(buf));
    const n = db.exec("SELECT COUNT(*) FROM run")[0]?.values[0][0] ?? 0;
    const when = res.headers.get("last-modified");
    status.textContent = `${n.toLocaleString()} runs \u00b7 ${(buf.byteLength/1048576).toFixed(1)} MB`
      + (when ? ` \u00b7 published ${when}` : "");
    $("run").disabled = $("csv").disabled = $("link").disabled = $("svg").disabled = false;
    setTab(tab, true);
    run();
  } catch (e) { fail("could not load database: " + e.message); }
})();

function run() {
  if (!db) return;
  const t0 = performance.now();
  try {
    const out = db.exec($("sql").value);
    if (!out.length) {
      cols = []; rows = [];
      meta.textContent = "no rows";
      render(); if (tab === "chart") draw();
      return;
    }
    cols = out[0].columns; rows = out[0].values; sortCol = null;
    meta.textContent = `${rows.length.toLocaleString()} rows \u00b7 ${(performance.now()-t0).toFixed(0)} ms`;
    status.className = "";
    render();
    if (tab === "chart") draw();
    syncHash();
  } catch (e) { meta.textContent = ""; fail("SQL error: " + e.message); }
}

function records() {
  return rows.map(r => Object.fromEntries(cols.map((c, i) => [c, r[i]])));
}

let chartView = null;
async function draw() {
  if (tab !== "chart") return;
  specerr.textContent = "";
  if (!rows.length) { $("chart").innerHTML = "<div style='color:var(--dim)'>query returned no rows</div>"; return; }
  let spec;
  try { spec = JSON.parse($("spec").value); }
  catch (e) { specerr.textContent = "spec is not valid JSON: " + e.message; return; }
  spec.data = { values: records() };
  try {
    if (chartView) { chartView.finalize(); chartView = null; }
    const r = await vegaEmbed("#chart", spec, {
      actions: false, renderer: "svg",
      theme: matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : undefined
    });
    chartView = r.view;
  } catch (e) { specerr.textContent = "Vega-Lite: " + (e.message || e); }
}

let specTimer = null;
$("spec").oninput = () => { clearTimeout(specTimer); specTimer = setTimeout(draw, 400); };

function render() {
  const idx = sortCol === null ? null : cols.indexOf(sortCol);
  let r = rows;
  if (idx !== null) {
    r = [...rows].sort((a, b) => {
      const x = a[idx], y = b[idx];
      if (x === y) return 0;
      if (x === null) return 1;
      if (y === null) return -1;
      return (typeof x === "number" && typeof y === "number" ? x - y
              : String(x).localeCompare(String(y))) * sortDir;
    });
  }
  $("head").innerHTML = "<tr>" + cols.map(c =>
    `<th data-c="${c}">${c}${c === sortCol ? (sortDir > 0 ? " \u25b2" : " \u25bc") : ""}</th>`).join("") + "</tr>";
  for (const th of $("head").querySelectorAll("th")) {
    th.onclick = () => {
      const c = th.dataset.c;
      sortDir = (c === sortCol) ? -sortDir : 1;
      sortCol = c; render();
    };
  }
  const shown = r.slice(0, 2000);
  $("body").innerHTML = shown.map(row => "<tr>" + row.map(v =>
    `<td class="${typeof v === "number" ? "num" : ""}">${
      v === null ? "" : String(v).replace(/[&<>]/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[m]))
    }</td>`).join("") + "</tr>").join("");
}

$("run").onclick = run;
$("sql").onkeydown = e => {
  if ((e.metaKey || e.ctrlKey) && e.key === "Enter") { e.preventDefault(); run(); }
};
$("spec").onkeydown = e => {
  if ((e.metaKey || e.ctrlKey) && e.key === "Enter") { e.preventDefault(); draw(); }
};

async function toClipboard(text) {
  try { await navigator.clipboard.writeText(text); return true; } catch {}
  const ta = document.createElement("textarea");
  ta.value = text; ta.style.cssText = "position:fixed;opacity:0";
  document.body.appendChild(ta); ta.select();
  let ok = false;
  try { ok = document.execCommand("copy"); } catch {}
  ta.remove();
  return ok;
}

$("link").onclick = async () => {
  const url = shareURL(), was = meta.textContent;
  const ok = await toClipboard(url);
  meta.textContent = ok ? `link copied \u00b7 ${url.length} chars`
                        : "could not copy \u2014 the address bar already holds it";
  setTimeout(() => { meta.textContent = was; }, 2500);
};

$("csv").onclick = () => {
  const esc = v => v === null ? "" :
    /[",\n]/.test(String(v)) ? `"${String(v).replace(/"/g, '""')}"` : String(v);
  const blob = new Blob([[cols.join(","), ...rows.map(r => r.map(esc).join(","))].join("\n")],
                        { type: "text/csv" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "corpus_query.csv"; a.click();
  URL.revokeObjectURL(a.href);
};

$("svg").onclick = async () => {
  if (!chartView) return;
  const svg = await chartView.toSVG();
  const blob = new Blob([svg], { type: "image/svg+xml" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "corpus_figure.svg"; a.click();
  URL.revokeObjectURL(a.href);
};
</script>
